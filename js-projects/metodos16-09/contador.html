<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="texto" onkeydown="verificarTecla(event)">
    <p>
    Total de caracteres:
    <span id="contador">0</span>
    </p>

    <script>
        let text = document.getElementById("texto")
        let counter = document.getElementById("contador")
        
       
       /*ao clickar enter*/

        function verificarTecla(event) {
        if (event.key === "Enter") {
            counter.textContent = text.value.length;
        }
}

        /*ao digitar*/

/*     
        text.addEventListener("input", function(){
            counter.innerHTML = text.value.length;
        })
            */
    </script>
</body>
</html>
