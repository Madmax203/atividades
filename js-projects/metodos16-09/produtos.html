<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p class="produto">Notebook</p>
    <p class="produto">Mouse</p>
    <p class="produto">Teclado</p>
    <p class="produto">Monitor</p>
    <button id="btnMostrar">
    Mostrar Produtos

    <script>
        let produtos = document.getElementsByClassName ("produto");
        let botao = document.getElementById("btnMostrar");
        
        botao.addEventListener("click", function(){
            for (let contagem = 0; contagem < produtos.length; contagem++){
                alert(produtos[contagem].textContent)
            }
        })
    </script>
</button>
</body>
</html>
