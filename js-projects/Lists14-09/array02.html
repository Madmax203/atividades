<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let notas = [];

        for (let i = 0; i < 4; i++) {
            let entrada = Number(prompt("Digite a nota " + (i + 1) + ":"));
            notas.push(entrada);
        }

        let media = (notas[0] + notas[1] + notas[2] + notas[3]) / 4;

        if (media >= 7) {
            alert("Aprovado!");
        }
        else if (media >= 6) {
            alert("Recuperação!");
        }
        else {
            alert("Reprovado!!");
        }
    </script>
</body>
</html>
