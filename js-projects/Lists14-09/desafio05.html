<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function contarAprovados(notas) {
        let aprovados = 0;

        for (let i = 0; i < notas.length; i++) {
            if (notas[i] >= 7) {
                aprovados++;
            }
        }

        return aprovados;
        }

        let notas = [8, 5, 7, 6, 9];

        alert(contarAprovados(notas));
    </script>
</body>
</html>
