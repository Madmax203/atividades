<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let notas = []

        notas[0] = Number(prompt("Digite a primeira nota: "))
        notas[1] = Number(prompt("Digite a segunda nota: "))
        notas[2] = Number(prompt("Digite o terceiro numero: "))
        notas[3] = Number(prompt("Digite o quarto numero: "))

        let media = (notas[0] + notas[1] + notas[2] + notas[3]) / 4;

        alert("Média: " + media)
    </script>
</body>
</html>
