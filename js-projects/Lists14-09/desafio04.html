<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let pontuacoes = [120, 450, 320, 890, 210]
        let maior = 0
        for (let i = 0; i < pontuacoes.length; i++){
            if(pontuacoes[i] > maior){
                maior = pontuacoes[i];
            }
        }
        alert(maior)
    </script>
</body>
</html>
