<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let lista = [];
        let i = 0;
        while (true) {
            let pergunta = prompt("Digite o " + (i + 1) + "° ingrediente: (0 para finalizar)");
            if(pergunta == 0){
                alert("Seu almoço terá: " + lista)
                break
            }
            lista.push(pergunta);
            i++
        }

    </script>
</body>
</html>
