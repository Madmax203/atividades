<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let carro = {
            marca: "Nissan",
            modelo: "Silvia S15",
            ano: "1999"
        };
        // 1. atualizando o ano
        carro.ano = "2000"

        // 2. adicionando a propriedade cor
        carro.cor ="preto"

        // 3. objeto completo

        alert("Marca: " + carro.marca + "\nModelo: " + carro.modelo + "\nAno: " + carro.ano )
        
    </script>
</body>
</html>
