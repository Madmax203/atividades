<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let cor = prompt("Qual a cor do semáforo??")

        if (cor == "verde"){
            alert("Pode seguir!")
        }
        else if (cor == "amarelo"){
            alert("Atenção!")
        }
        else if (cor == "vermelho"){
            alert("Pare!!")
        }
    </script>
</body>
</html>
