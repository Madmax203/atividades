<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let idade = prompt("Qual sua idade??")

        if (idade < 12){
            alert("criança")
        }
        else if (idade >= 12 && idade <= 17){
            alert("adolescente")
        }
        else {
            alert("adulto")
        }
    </script>
</body>
</html>
