<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function Par(numero){
            if (numero % 2 === 0){
                return "Par";
            }
            else{
                return "Impar";
            }
        }
        while (true) {
            let number = Number(prompt("Digite um numero! "))
            alert(Par(number))
        }
        
    </script>
</body>
</html>
