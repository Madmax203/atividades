<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function Triplo (numero){
            return numero * 3
        }

        while (true){
            let number = Number(prompt("Digite um numero: "))
            alert(Triplo(number))
        }
        

    </script>
</body>
</html>
