<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p class="produto">Notebook</p> 
    <p class="produto">Mouse</p> 
    <p class="produto">Monitor</p> 
    <p class="produto">Teclado</p> 
    <button id="btn"> Listar Produtos </button> 

    <script>
        let produtos = document.getElementsByClassName("produto");
        let botao = document.getElementById("btn");

        botao.addEventListener("click", function(){
            for(let i = 0; i < produtos.length; i++){
                alert(produtos[i].textContent)
                console.log(produtos[i].textContent)
            }
        })
    </script>
</body>
</html>
