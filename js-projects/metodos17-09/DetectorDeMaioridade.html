<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="number" id="idade"> 
    <button id="verificar"> Verificar </button> 
    <p id="resultado"></p> 

    <script>
        let entrada = document.getElementById("idade");
        let botao = document.getElementById("verificar");
        let mensagem = document.getElementById("resultado")

        botao.addEventListener("click", function(){
            if(entrada.value >= 18){
                mensagem.textContent = "Acesso permitido!!"
            }
            else{
                mensagem.textContent = "Acesso negado!!"
            }
        })
    </script>
</body>
</html>
