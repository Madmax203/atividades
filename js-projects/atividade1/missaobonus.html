<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let pontuacao = prompt("Qual sua pontuação")
        if (pontuacao >= 90){
            alert("Nível lendário")
        }
        else if (pontuacao >= 70 && pontuacao <= 89){
            alert("Nível Ouro")
        }
        else if (pontuacao >= 50 && pontuacao <= 69){
            alert("Nível prata")
        }
        else if (pontuacao < 50){
            alert("Nível bronze")
        }
    </script>
</body>
</html>
