<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let numero = prompt("Digite um numero")
        if (numero > 0){
            alert("Positivo")
        }
        else if (numero < 0){
            alert("Negativo")
        }
        else{
            alert("Zero!")
        }
    </script>
</body>
</html>
