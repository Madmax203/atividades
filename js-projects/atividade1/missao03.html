<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let nota = prompt("Digite a sua média final! ")
        if (nota >= 7){
            alert("aprovado")
        }
        else if (nota >= 5 && nota < 7){
            alert("recuperação")
        }
        else{
            alert("reprovado")
        }
    </script>
</body>
</html>
