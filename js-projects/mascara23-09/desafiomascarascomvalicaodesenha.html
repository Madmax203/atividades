<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário com Validação Avançada de Senha</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f4f9;
        }
        form {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .campo {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .contador {
            font-size: 12px;
            color: red;
            margin-top: 3px;
        }
        /* Estilos para os requisitos da senha */
        .requisitos {
            font-size: 11px;
            margin-top: 5px;
            list-style: none;
            padding-left: 0;
        }
        .requisitos li {
            color: #d9534f; /* Vermelho (não atendido) */
            margin-bottom: 2px;
        }
        .requisitos li.valido {
            color: #5cb85c; /* Verde (atendido) */
        }
    </style>
</head>
<body>

    <form>
        <!-- Nome -->
        <div class="campo">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Apenas letras">
        </div>

        <!-- CPF -->
        <div class="campo">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00">
        </div>

        <!-- RG -->
        <div class="campo">
            <label for="rg">RG:</label>
            <input type="text" id="rg" placeholder="Apenas números">
        </div>

        <!-- CEP -->
        <div class="campo">
            <label for="cep">CEP:</label>
            <input type="text" id="cep" maxlength="8" placeholder="Apenas números (8 dígitos)">
        </div>

        <!-- Endereço -->
        <div class="campo">
            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" placeholder="Rua, número, bairro">
        </div>

        <!-- UF -->
        <div class="campo">
            <label for="uf">UF:</label>
            <input type="text" id="uf" maxlength="2" placeholder="Ex: SP">
        </div>

        <!-- Senha com validação avançada -->
        <div class="campo">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="Digite sua senha forte">
            <div class="contador">Caracteres digitados: <span id="contadorSenha">0</span></div>
            
            <!-- Lista de regras visuais -->
            <ul class="requisitos">
                <li id="req-tamanho">Mínimo de 8 caracteres</li>
                <li id="req-maiuscula">Pelo menos uma letra maiúscula</li>
                <li id="req-minuscula">Pelo menos uma letra minúscula</li>
                <li id="req-numero">Pelo menos um número</li>
                <li id="req-especial">Pelo menos um caractere especial (ex: @, #, $, etc.)</li>
            </ul>
        </div>
    </form>

    <script>
        // --- VALIDAÇÕES DOS OUTROS CAMPOS ---
        const inputNome = document.getElementById('nome');
        inputNome.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[0-9]/g, '');
        });

        const inputCpf = document.getElementById('cpf');
        inputCpf.addEventListener('input', (e) => {
            let valor = e.target.value.replace(/\D/g, "").substring(0, 11);
            valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
            valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
            valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
            e.target.value = valor;
        });

        const inputRg = document.getElementById('rg');
        inputRg.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
        });

        const inputCep = document.getElementById('cep');
        inputCep.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, "").substring(0, 8);
        });

        const inputUf = document.getElementById('uf');
        inputUf.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^a-zA-Z]/g, '').substring(0, 2).toUpperCase();
        });

        // --- VALIDAÇÃO DA SENHA AVANÇADA ---
        const inputSenha = document.getElementById('senha');
        const spanContador = document.getElementById('contadorSenha');
        
        // Elementos da lista de requisitos
        const reqTamanho = document.getElementById('req-tamanho');
        const reqMaiuscula = document.getElementById('req-maiuscula');
        const reqMinuscula = document.getElementById('req-minuscula');
        const reqNumero = document.getElementById('req-numero');
        const reqEspecial = document.getElementById('req-especial');

        inputSenha.addEventListener('input', (e) => {
            let valor = e.target.value;
            
            // 1. Atualiza o contador em vermelho
            spanContador.textContent = valor.length;

            // 2. Valida o tamanho mínimo (8 caracteres)
            if (valor.length >= 8) {
                reqTamanho.classList.add('valido');
            } else {
                reqTamanho.classList.remove('valido');
            }

            // 3. Valida letra maiúscula
            if (/[A-Z]/.test(valor)) {
                reqMaiuscula.classList.add('valido');
            } else {
                reqMaiuscula.classList.remove('valido');
            }

            // 4. Valida letra minúscula
            if (/[a-z]/.test(valor)) {
                reqMinuscula.classList.add('valido');
            } else {
                reqMinuscula.classList.remove('valido');
            }

            // 5. Valida número
            if (/[0-9]/.test(valor)) {
                reqNumero.classList.add('valido');
            } else {
                reqNumero.classList.remove('valido');
            }

            // 6. Valida caractere especial (tudo que não for letra nem número)
            if (/[^A-Za-z0-9]/.test(valor)) {
                reqEspecial.classList.add('valido');
            } else {
                reqEspecial.classList.remove('valido');
            }
        });
    </script>

</body>
</html>
