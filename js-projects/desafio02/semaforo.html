<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let cor = prompt("Qual a cor do semaforo")

        if (cor == "verde"){
            alert("Pode seguir!")
        }

        else if (cor == "amarelo"){
            alert("Atenção")
        }
        else if (cor == "vermelho"){
            alert("Pare")
        }
        else {
            alert("Nem tem essa cor, esse menino!!")
        }
    </script>
</body>
</html>
