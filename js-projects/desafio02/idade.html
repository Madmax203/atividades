<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let idade = prompt("Digite sua idade ")

        if (idade < 12){
            alert("Criança")
        }
        else if (idade >=12 && idade < 18){
            alert("Adolescente")
        }
        else{
            alert("Adulto")
        }
    </script>
</body>
</html>
