<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <!-- Navbar -->
    <div class="menu">
        <ul class="interaction">
            <li id="login">login</li>
            <li id="cadastro">cadastro</li>
        </ul>
    </div>
    

     <!-- Modal 1 -->
    <div class="modalBackground hide">
        <div class="modalCard">
            
            <div class="section">
                <h1>Login</h1>
            </div>
            <div class="section">
                <label for="email">Email</label>
                <input type="text" id="email">
            </div>
            <div class="section">
                <label for="senha">Senha</label>
                <input type="text" id="senha">
            </div>
            <div class="section">
                <button id="btnLogin">Enviar</button>
            </div>
        </div>
    </div>
    <!-- modal 2 -->
    <div class="modalBackground hide">
        <div class="modalCard">
            
            <div class="section">
                <h1>Login</h1>
            </div>
            <div class="section">
                <label for="emailCadastro">Email</label>
                <input type="text" id="emailCadastro">
            </div>
            <div class="section">
                <label for="senha">Senha</label>
                <input type="text" id="senhaCadastro">
            </div>
            <div class="section">
                <label for="confirmSenhaCadastro">Confirmar Senha</label>
                <input type="text" id="confirmSenhaCadastro">
            </div>
            <div class="section">
                <button id="btnLoginCadastro">Enviar</button>
            </div>
        </div>
    </div>


    <script>
        let modalBackground = document.querySelector('.modalBackground')
        let btnLogin = document.querySelector('#btnLogin')
        let login = document.querySelector('#login')
        let hide = document.querySelector('.hide')

        let emailCadastro = document.querySelector('#emailCadastro')
        let senhaCadastro = document.querySelector('#senhaCadastro')
        let confirmSenhaCadastro = document.querySelector('#confirmSenhaCadastro')


        function abrirModal(){
            modalBackground.classList.remove('hide')
            
        }

        function fecharModal(){
            modalBackground.classList.add('hide')
        }

        login.addEventListener("click", abrirModal)
        btnLogin.addEventListener("click", fecharModal)

        modalBackground.addEventListener("click", function(e){
            if(modalBackground === e.target){
                fecharModal()
            }
        })
    </script>
</body>

</html>
