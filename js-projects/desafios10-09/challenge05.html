<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let entrada = prompt("Digite um numero: ")
        while (entrada < 0){
            alert("Numeros negativos não são aceitos")
            entrada = prompt("Digite um numero: ")
        }
        alert("Número aceito!")
    </script>
</body>
</html>
