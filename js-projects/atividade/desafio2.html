<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num1 = Number(prompt("Digite um número"))
        if (num1 > 0 ){
            alert("O numero é maior que zero")
        }
        else if (num1 < 0){
            alert("o numero é menor que zero")
        }
        else {
            alert("O numero é igual a zero")
        }
    </script>
</body>
</html>
