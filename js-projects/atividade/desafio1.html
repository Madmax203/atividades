<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num1 = Number(prompt("Digite o primeiro numero!: "))
        let num2 = Number(prompt("Digite o segundo numero!: "))

        let soma = (num1 + num2)
        let subtracao = (num1 - num2)
        let multiplicacao = (num1 * num2)
        let divisao = (num1 / num2)

        alert("Resultado da soma dos dois numeros: " + soma + 
            "\nResultado da subtração dos dois numeros: " + subtracao +
            "\nResultado da multiplicação dos dois numeros " + multiplicacao +
            "\nResultado da divisão dos dois numeros " + divisao)
        
    </script>
</body>
</html>
